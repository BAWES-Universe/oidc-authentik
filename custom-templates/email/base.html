{% load authentik_stages_email %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtm=l">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width">
    <meta name="color-scheme" content="dark light">
    <meta name="supported-color-schemes" content="dark light">

    <style type="text/css">
      body {
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #EDEDF2;
        background-color: #0E0E11;
      }

      h1, h2 {
        display: inline-block;
        font-family: Arial, sans-serif;
        font-size: 28px;
        line-height: 125%;
        font-weight: 700;
        padding-top: 10px;
        padding-bottom: 10px;
        margin: 0;
        color: #FFFFFF;
      }

      .flexibleImage {
        height: auto;
      }

      img.logo {
        max-width: 100%;
        max-height: 52px;
        height: auto;
      }

      .properties-table {
        width: 100%;
        text-align: left;
        font-size: 14px;
        font-weight: 400;
        font-family: Arial, sans-serif;
        border-collapse: collapse;
      }

      .properties-table tr:first-child {
        border-top: 1px solid rgba(196, 196, 196, 0.2);
      }

      .properties-table tr:first-child>td {
        padding-top: 24px;
      }

      .properties-table tr:last-child {
        border-bottom: 1px solid rgba(196, 196, 196, 0.2);
      }

      .properties-table tr:last-child>td {
        padding-bottom: 24px;
      }

      .properties-table td {
        line-height: 24px;
        vertical-align: top;
        padding: 4px 15px;
      }

      .td-right {
        text-align: right;
        white-space: nowrap;
      }
      .btn-primary {
        text-decoration: none;
        color: #FFFFFF;
        background-color: #1E6FD9;
        border: solid #1E6FD9;
        width: 100%;
        line-height: 2em;
        font-weight: bold;
        text-align: center;
        cursor: pointer;
        display: inline-block;
        text-transform: capitalize;
      }
      .btn-primary a {
        color: #FFFFFF;
      }
      a {
        color: #6FA8FF;
      }
    </style>
  </head>

  <body style="margin:0; padding:0; background-color:#0E0E11;">
    <!-- outer full-width background table: bgcolor + inline style, so clients that
         drop CSS backgrounds still paint dark -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           bgcolor="#0E0E11" style="width:100%; background-color:#0E0E11;">
      <tr>
        <td align="center" bgcolor="#0E0E11"
            style="background-color:#0E0E11; padding:40px 20px;">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="width:100%; max-width:448px;">

            <!-- the card: background on a TD with bgcolor, text colour inherited -->
            <tr>
              <td bgcolor="#17171C"
                  style="background-color:#17171C; border:1px solid #2B2B33; padding:20px;
                         color:#EDEDF2; font-family:Arial,sans-serif; font-size:14px;">

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                       bgcolor="#17171C" style="width:100%; background-color:#17171C;">

                  <tr height="80">
                    <td align="center" bgcolor="#17171C" style="background-color:#17171C; padding:20px 0;">
                      <img src="{% block logo_url %}https://auth.bawes.net/media/custom/favicon-trans-512x512.png{% endblock %}"
                           width="44" height="44" border="0" alt="BAWES Universe"
                           style="width:44px; height:44px; border:0; display:block; margin:0 auto 10px auto;">
                      <div style="font-family:Arial,sans-serif; font-size:17px; font-weight:bold; letter-spacing:3px; color:#FFFFFF; mso-line-height-rule:exactly;">
                        BAWES <span style="font-weight:normal; color:#C9C9D2;">UNIVERSE</span>
                      </div>
                    </td>
                  </tr>

                  {% block content %}
                  {% endblock %}

                </table>
              </td>
            </tr>

            <!-- small print band -->
            <tr>
              <td bgcolor="#121216" style="background-color:#121216; color:#A6A6B2;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                       bgcolor="#121216" style="width:100%; background-color:#121216;">
                  {% block sub_content %}
                  {% endblock %}
                </table>
              </td>
            </tr>

            <tr>
              <td align="center" bgcolor="#0E0E11"
                  style="background-color:#0E0E11; padding:14px 0; color:#7A7A85; font-size:12px; font-family:Arial,sans-serif;">
                <span style="color:#7A7A85;">Universe &middot;
                  <a href="https://universe.bawes.net" style="color:#7A7A85; text-decoration:underline;">universe.bawes.net</a>
                </span>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
